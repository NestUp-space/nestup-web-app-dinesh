steps:
  # Install backend dependencies and build
  - name: 'gcr.io/cloud-builders/npm'
    args: ['ci']
    dir: 'backend'
  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'build']
    dir: 'backend'

  # Build the backend Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/nestup-backend:$COMMIT_SHA', './backend']
    id: 'Build Backend Image'

  # Push the backend Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/nestup-backend:$COMMIT_SHA']
    waitFor: ['Build Backend Image']
    id: 'Push Backend Image'

  # Deploy backend to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'nestup-backend' # Name of your Cloud Run service
      - '--image'
      - 'gcr.io/$PROJECT_ID/nestup-backend:$COMMIT_SHA'
      - '--region'
      - 'asia-south1' # Specify your desired region
      - '--platform'
      - 'managed'
      - '--quiet'
      - '--allow-unauthenticated' # For public access, adjust as needed
      # Add environment variables for Cloud Run.
      # These can also be set via Secret Manager for sensitive values.
      # Example: '--set-env-vars=NODE_ENV=production,PORT=8080'
      # For DATABASE_URL with Cloud SQL, it's best to use a Cloud SQL connection.
      # Cloud Run will automatically provide the /cloudsql/... path.
      # Ensure your DATABASE_URL in .env (and thus in Cloud Run env vars)
      # is formatted like: postgresql://USER:PASS@localhost/DBNAME?schema=public&host=/cloudsql/PROJECT_ID:REGION:INSTANCE_ID
      # Add other necessary environment variables here or via Secret Manager
    waitFor: ['Push Backend Image']

substitutions:
  _TRIGGER_ID: 'default' # Default value, can be overridden by trigger

options:
  logging: CLOUD_LOGGING_ONLY
