<!DOCTYPE html>
<html>
<head>
    <base target="_top">
    <title>Cutlist Report</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 500px; margin: 0 auto; }
        .button { 
            background: #4285f4; 
            color: white; 
            padding: 15px 20px; 
            border: none; 
            border-radius: 5px; 
            cursor: pointer; 
            margin: 10px 5px; 
            width: 200px;
            font-size: 14px;
        }
        .button:hover { background: #3367d6; }
        .section { margin: 20px 0; }
        .summary { background: #f8f9fa; padding: 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>📊 Cutlist Report Ready</h2>
        
        <div class="section summary">
            <h3>Project Summary</h3>
            <p><strong>Total Sheets:</strong> <?= reportData.summary.totalSheets ?></p>
            <p><strong>Total Planks:</strong> <?= reportData.summary.totalPlanks ?></p>
            <p><strong>Overall Utilization:</strong> <?= reportData.summary.overallUtilization ?>%</p>
            <p><strong>Generated:</strong> <?= reportData.summary.generatedDate ?></p>
        </div>

        <div class="section">
            <h3>Download Options</h3>
            <button class="button" onclick="downloadReport('html')">📄 Download HTML Report</button>
            <button class="button" onclick="downloadReport('text')">📝 Download Text Report</button>
            <button class="button" onclick="downloadReport('csv')">📊 Download CSV Data</button>
            <button class="button" onclick="downloadReport('json')">🔧 Download JSON Data</button>
        </div>

        <div class="section">
            <button class="button" onclick="viewReport()" style="background: #34a853;">👁️ View Report Preview</button>
            <button class="button" onclick="google.script.host.close()" style="background: #ea4335;">❌ Close</button>
        </div>
    </div>

    <script>
        // Store report data in a variable for client-side use
        const reportData = <?!= JSON.stringify(reportData) ?>;
        
        // Generate HTML content for preview
        const htmlContent = generateHTMLPreview(reportData);

        function downloadReport(format) {
            google.script.run
                .withSuccessHandler(triggerDownload)
                .withFailureHandler(showError)
                .generateReportDownload(format, reportData);
        }

        function triggerDownload(data) {
            const blob = new Blob([data.content], { type: data.mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = data.filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function viewReport() {
            const newWindow = window.open('', '_blank');
            newWindow.document.write(htmlContent);
            newWindow.document.close();
        }

        function showError(error) {
            alert('Error generating report: ' + error.message);
        }

        // Simple HTML preview generator
        function generateHTMLPreview(data) {
            const { summary, sheets, materialThicknessStats } = data;
            const usableSheetArea = (1220 - 20) * (2440 - 20);
            
            let html = `
<!DOCTYPE html>
<html>
<head>
    <title>Cutlist Report Preview</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; margin: 10px 0; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f2f2f2; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Cutlist Report Preview</h1>
        <p>Generated: ${summary.generatedDate}</p>
    </div>
    
    <div class="section">
        <h2>Project Summary</h2>
        <p><strong>Total Sheets:</strong> ${summary.totalSheets}</p>
        <p><strong>Total Planks:</strong> ${summary.totalPlanks}</p>
        <p><strong>Overall Utilization:</strong> ${summary.overallUtilization}%</p>
    </div>
    
    <div class="section">
        <h2>Sheet Utilization</h2>
        <table>
            <tr><th>Sheet #</th><th>Planks</th><th>Used Area</th><th>Utilization</th></tr>`;
            
            Object.entries(sheets).forEach(([sheetNum, sheet]) => {
                const utilization = ((sheet.usedArea / usableSheetArea) * 100).toFixed(1);
                html += `<tr>
                    <td>Sheet ${sheetNum}</td>
                    <td>${sheet.planks.length}</td>
                    <td>${Math.round(sheet.usedArea)} mm²</td>
                    <td>${utilization}%</td>
                </tr>`;
            });
            
            html += `</table>
    </div>
    
    <div class="section">
        <h2>Materials Summary</h2>
        <table>
            <tr><th>Material</th><th>Planks</th><th>Total Area</th><th>Sheets</th></tr>`;
            
            Object.values(materialThicknessStats).forEach(stats => {
                html += `<tr>
                    <td>${stats.material} (${stats.thickness}mm)</td>
                    <td>${stats.plankCount}</td>
                    <td>${Math.round(stats.totalArea)} mm²</td>
                    <td>${stats.sheetCount}</td>
                </tr>`;
            });
            
            html += `</table>
    </div>
</body>
</html>`;
            return html;
        }
    </script>
</body>
</html>
